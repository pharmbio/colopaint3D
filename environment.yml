# The one environment for everything in this repo: notebooks, run_all.py and scripts/.
#
#     conda env create -f environment.yml
#     conda activate colopaint3d
#
# There is no package to install — helpers are imported from utils/ directly.
#
# Every entry below is imported by code that produces a paper panel, or is a version
# constraint holding one that is.
name: colopaint3d
channels:
  - conda-forge
dependencies:
  # numba 0.56 / llvmlite 0.39 cap this at 3.10
  - python=3.10
  - pip
  - pip:
      # --- Cell Painting pipeline ---------------------------------------------
      - pycytominer==0.2.0     # 2_Processing, normalisation and feature selection
      - cytominer-eval==0.1    # grit scores

      # --- Core scientific stack ----------------------------------------------
      - pandas==1.5.2
      - numpy==1.22.0
      - scipy==1.7.3
      - scikit-learn==1.6.1
      - pyarrow==20.0.0        # the parquet engine behind every read_parquet
      - fastparquet==2022.12.0 # second parquet engine, for tables pyarrow trips on
      - polars==1.35.1         # 1_FeatureSorting, 3_CellCoverage

      # --- Plotting -----------------------------------------------------------
      - matplotlib==3.7.1
      - seaborn==0.13.2
      - adjustText==1.3.0      # label placement, Fig 6c
      - openpyxl==3.1.5        # scripts/make_source_data.py
      - pymupdf                # scripts/check_panels_nonblank.py

      # --- Dimensionality reduction (Fig 4, Suppl 4h) -------------------------
      # numba and llvmlite are not imported directly. They are pinned because
      # umap-learn pulls numba, and anything newer than 0.56 requires numpy>=1.24.
      - umap-learn==0.5.3
      - numba==0.56.4
      - llvmlite==0.39.1
      - tqdm==4.67.1

      # scikit-image must stay pinned even though it is not numerically
      # load-bearing: unpinned, pip resolves 0.25.x, which drags numpy to 2.x and
      # scipy to 1.11 and takes the environment down with it — numba 0.56.4
      # requires numpy<1.24, and pycytominer imports
      # scipy.stats.median_absolute_deviation, removed after scipy 1.7.
      - scikit-image==0.19.3   # Suppl 2d, segmentation error

      # --- Notebook execution -------------------------------------------------
      # run_all.py prefers papermill and falls back to nbconvert. Only nbconvert
      # is declared: it is the backend every run has actually used, so it is the
      # one that is tested. Install papermill yourself if you want it.
      - nbconvert==7.16.6

# Dropped deliberately — nothing that makes a paper panel imports them:
#   copairs     -> mAP scoring; the mAP panel never reached the paper (0 imports)
#   gseapy      -> only hallmark_nes_scatter.ipynb, and only if
#                  data/gsea_prerank_results.csv is missing; that table is
#                  committed, and the cell it feeds is marked "not a paper panel"
#   statsmodels -> was only ever pulled in transitively by copairs
#   tifffile, pillow -> the image-plotting code they served is no longer in the paper
#   nbformat    -> 0 imports; nbconvert pulls it in anyway
#   jupyter     -> meta-package; nbconvert is the only part run_all.py invokes
#   anndata, harmonypy, cuml, networkx, sqlalchemy, psycopg2-binary
#               -> single-cell/Harmony, GPU UMAP, network and database code, none
#                  of which is in this repo
